name: Release Chrome extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        env:
          EXTENSION_SIGNING_KEY_B64: ${{ secrets.EXTENSION_SIGNING_KEY_B64 }}
        run: |
          test -n "$EXTENSION_SIGNING_KEY_B64"
          printf '%s' "$EXTENSION_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/extension.pem"
          chmod 600 "$RUNNER_TEMP/extension.pem"

      - name: Package signed extension
        run: |
          scripts/package-extension.sh "$RUNNER_TEMP/extension.pem" dist/claude-bridge.crx
          sha256sum dist/claude-bridge.crx > dist/claude-bridge.crx.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/claude-bridge.crx
          dist/claude-bridge.crx.sha256
          --generate-notes
          --title "Claude Bridge $GITHUB_REF_NAME"
